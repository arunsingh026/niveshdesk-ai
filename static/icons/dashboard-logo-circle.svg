<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f2fe;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f3e8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fef3c7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="letterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.3" />
    </linearGradient>
  </defs>

  <!-- Background Circle with Gradient -->
  <circle cx="256" cy="256" r="250" fill="url(#bgGradient)"/>
  <circle cx="256" cy="256" r="250" fill="none" stroke="url(#borderGradient)" stroke-width="12"/>

  <!-- White Inner Circle for Content -->
  <circle cx="256" cy="200" r="120" fill="rgba(255,255,255,0.9)"/>

  <!-- Letter A (Main Logo) -->
  <path d="M 210 240 L 235 160 L 255 160 L 280 240" stroke="url(#letterGradient)" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 220 210 L 270 210" stroke="url(#letterGradient)" stroke-width="18" fill="none" stroke-linecap="round"/>

  <!-- Arrow -->
  <path d="M 265 150 L 310 185 M 310 185 L 290 190 M 310 185 L 305 165" stroke="#10b981" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dashboard Icons Around -->

  <!-- Chart Icon (Left) -->
  <rect x="140" y="160" width="50" height="50" rx="12" fill="#3b82f6"/>
  <g transform="translate(165, 185)">
    <rect x="-8" y="8" width="4" height="12" fill="white"/>
    <rect x="-2" y="4" width="4" height="16" fill="white"/>
    <rect x="4" y="0" width="4" height="20" fill="white"/>
    <polyline points="-8,-2 -2,-6 4,-2" stroke="white" stroke-width="2" fill="none"/>
  </g>

  <!-- Trend Icon (Top Right) -->
  <rect x="322" y="120" width="50" height="50" rx="12" fill="#10b981"/>
  <path d="M 340 148 L 350 138 L 360 142 M 350 138 L 350 145 M 350 138 L 357 138" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Wallet Icon (Right) -->
  <rect x="322" y="195" width="50" height="50" rx="12" fill="#0ea5e9"/>
  <rect x="335" y="210" width="24" height="18" rx="3" stroke="white" stroke-width="2.5" fill="none"/>
  <rect x="339" y="207" width="16" height="5" fill="white"/>

  <!-- Bell Icon (Bottom Right) -->
  <rect x="322" y="270" width="50" height="50" rx="12" fill="#a855f7"/>
  <path d="M 347 285 Q 342 285 342 290 L 342 298 Q 342 302 347 302 Q 352 302 352 298 L 352 290 Q 352 285 347 285 M 340 302 L 354 302 M 347 302 L 347 305" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Calendar Icon (Bottom Left) -->
  <rect x="140" y="270" width="50" height="50" rx="12" fill="#f59e0b"/>
  <rect x="152" y="283" width="26" height="26" rx="3" stroke="white" stroke-width="2.5" fill="none"/>
  <line x1="157" y1="286" x2="157" y2="280" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="173" y1="286" x2="173" y2="280" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="152" y1="293" x2="178" y2="293" stroke="white" stroke-width="2"/>

  <!-- Text: ARUN'S -->
  <text x="256" y="375" font-family="Arial, sans-serif" font-size="72" font-weight="900" text-anchor="middle" fill="#1e293b">ARUN'S</text>

  <!-- Text: PERSONAL DASHBOARD -->
  <text x="256" y="405" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#64748b" letter-spacing="3">PERSONAL DASHBOARD</text>

  <!-- Tagline: PLAN • TRACK • ACHIEVE -->
  <g>
    <text x="160" y="445" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#3b82f6">PLAN</text>
    <text x="230" y="445" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#667085">•</text>
    <text x="250" y="445" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#a855f7">TRACK</text>
    <text x="330" y="445" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#667085">•</text>
    <text x="345" y="445" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#10b981">ACHIEVE</text>
  </g>
</svg>