databases:
  - name: niveshdesk-db
    plan: free
    databaseName: niveshdesk
    user: niveshdesk

services:
  - type: web
    name: niveshdesk-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: niveshdesk-db
          property: connectionString
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: DRY_RUN_NOTIFICATIONS
        value: "true"
