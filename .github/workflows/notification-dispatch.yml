name: Notification Dispatch

on:
  schedule:
    # Offset from the hour to avoid peak-time scheduler congestion.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notification-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      NOTIFICATION_CRON_TOKEN: ${{ secrets.NOTIFICATION_CRON_TOKEN }}
      APP_URL: ${{ vars.NOTIFICATION_APP_URL || 'https://arunsingh026.pythonanywhere.com' }}
    steps:
      - name: Verify application health
        run: |
          curl --fail --show-error --silent \
            --retry 3 --retry-all-errors --retry-delay 5 --max-time 30 \
            "${APP_URL}/health" | jq -e '.status == "ok" and .notification_scheduler.running == true'

      - name: Check and send due notifications
        if: ${{ env.NOTIFICATION_CRON_TOKEN != '' }}
        run: |
          response="$(curl --fail --show-error --silent \
            --retry 2 --retry-all-errors --max-time 90 \
            --request POST \
            --header "X-Notification-Token: ${NOTIFICATION_CRON_TOKEN}" \
            "${APP_URL}/api/notifications/dispatch")"
          jq -e '.status == "completed" or .status == "quiet_hours"' <<<"${response}"

      - name: Report fallback status
        if: ${{ env.NOTIFICATION_CRON_TOKEN == '' }}
        run: |
          echo "::warning::NOTIFICATION_CRON_TOKEN is not configured. The verified in-app scheduler remains active; add the secret to enable the hourly fallback."
