name: CI Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Starting CI Build
        run: echo "Starting CI Build"

      - name: Run SonarQube analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements.txt

      - name: Test notification backend
        working-directory: backend
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: pytest -q tests

      - name: Build backend package
        run: |
          python -m compileall -q backend/app
          cd backend
          zip -r ../backend-package.zip app requirements.txt

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-package
          path: backend-package.zip
          if-no-files-found: error

      - name: Verify live deployment
        if: ${{ github.event_name == 'push' }}
        run: |
          curl --fail --show-error --silent --retry 3 --retry-all-errors --retry-delay 5 --max-time 30 https://arunsingh026.pythonanywhere.com/health
          curl --fail --show-error --silent --retry 3 --retry-all-errors --retry-delay 5 --max-time 30 https://arunsingh026.pythonanywhere.com/ | grep -q '<div id="root"></div>'

      - name: CI Build Completed Successfully
        run: echo "CI Build Completed Successfully"
